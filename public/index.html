<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Whiteboard</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #whiteboard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #graph-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 400px;
      height: 300px;
      background: white;
      border: 1px solid #ccc;
      z-index: 10;
      display: none;
    }
    .ui-element {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 5px;
    }
    .ui-element button {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="whiteboard"></canvas>
    <div id="graph-container">
      <canvas id="graph-canvas"></canvas>
    </div>
    <div class="ui-element">
      <button id="start-record-btn">Start Voice Recognition</button>
      <button id="extract-eq-btn">Extract Equation</button>
      <p id="status"></p>
    </div>
  </div>
  <script src="dist/bundle.js"></script>
</body>
</html>
